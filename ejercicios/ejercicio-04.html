<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Tablas HTML</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4 text-primary">Generador de Tablas HTML</h2>
    <div class="mb-3">
      <button id="btn-add-fila" class="btn btn-primary me-2">Añadir Fila</button>
      <button id="btn-remove-fila" class="btn btn-primary me-2">Eliminar Fila</button>
      <button id="btn-add-col" class="btn btn-primary me-2">Añadir Columna</button>
      <button id="btn-remove-col" class="btn btn-primary me-2">Eliminar Columna</button>
      <button id="btn-delete-tabla" class="btn btn-primary">Eliminar Tabla Completa</button>
    </div>
    <div id="contenedor-tabla" class="mt-4">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Dato 1</td>
            <td>Dato 2</td>
          </tr>
          <tr>
            <td>Dato 3</td>
            <td>Dato 4</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="ejercicio-04.js"></script>
</body>
</html>
