<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Marta Melguizo</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-top: 5px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .botones {
            margin-top: 15px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Cifrado César</h1>

    <div>
        <label for="textoEntrada">Texto a cifrar o descifrar:</label>
        <textarea id="textoEntrada" placeholder="Escribe aquí tu texto..."></textarea>
        <div class="botones">
            <button id="btnCifrar">Cifrar</button>
            <button id="btnDescifrar">Descifrar</button>
        </div>
        <label for="textoResultado">Resultado:</label>
        <textarea id="textoResultado" readonly placeholder="El resultado aparecerá aquí..."></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
