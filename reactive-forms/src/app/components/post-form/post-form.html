<div class="container py-4" style="max-width: 640px">
    <h1>Nueva publicación</h1>

    <!-- Reactive forms: cada campo se enlaza a su FormControl con [formControl] -->
    <div class="mb-3">
        <label for="title" class="form-label">Título</label>
        <input type="text" class="form-control" id="title" [formControl]="title">
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" rows="4" [formControl]="description"></textarea>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Categoría</label>
        <select class="form-select" id="category" [formControl]="category">
            <option value="" disabled>Selecciona una categoría</option>
            @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
            }
        </select>
    </div>

    <div class="mb-3">
        <label for="tags" class="form-label">Etiquetas</label>
        <input type="text" class="form-control" id="tags" placeholder="angular, web, frontend" [formControl]="tags">
        <div class="form-text">Separadas por comas.</div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email del autor</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" [formControl]="email">
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="publishNow" [formControl]="publishNow">
        <label class="form-check-label" for="publishNow">Publicar ahora</label>
    </div>

    <div class="mb-3">
        <label for="publishDate" class="form-label">Programar fecha</label>
        <div class="input-group">
            <input class="form-control" id="publishDate" placeholder="yyyy-mm-dd" ngbDatepicker
                #d="ngbDatepicker" [formControl]="publishDate">
            <button class="btn btn-outline-secondary" type="button"
                (click)="d.toggle()">Calendario</button>
        </div>
    </div>

    <button type="button" (click)="sendForm()" class="btn btn-primary">Publicar</button>
</div>
